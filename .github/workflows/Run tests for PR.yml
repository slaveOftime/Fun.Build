name: Run tests for PR

on:  
  pull_request:
    branches:
    - master
    
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    - name: Use build.fsx
      run: dotnet fsi ./build.fsx -- -p test
