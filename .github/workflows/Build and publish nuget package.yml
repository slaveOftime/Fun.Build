name: Build and publish nuget packages

on:
  push:
    branches:
    - master
    paths:
    - Fun.Build/CHANGELOG.md
    - Fun.Build.Cli/CHANGELOG.md
    - ".github/workflows/Build and publish nuget package.yml"
    
jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write  # required for NuGet.org trusted publishing (OIDC)

    steps:
    - uses: actions/checkout@v7
    
    - name: NuGet login (OIDC -> short-lived API key)
      id: nuget-login
      uses: NuGet/login@v1
      with:
        # nuget.org profile name (the owner of the trusted publishing policy)
        user: slaveoftime

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    - name: Use build.fsx
      env:
        NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
      run: dotnet fsi ./build.fsx -- -p packages
